name: Pokemon Cards Watch Loop

# 10분마다 속보 확인 + 정해진 시각(한국시간 09/13/17/21시 정기, 12/18시 구매 정보)에 발행.
# GitHub 예약 실행은 몇 시간씩 밀리는 일이 잦아서, 실행 하나를 약 5시간 40분 동안 유지하고 끝날 때 자기 자신을
# 다시 실행해 이어 간다. 아래 cron 은 사슬이 끊겼을 때 되살리는 안전장치다 (이미 돌고 있으면 대기했다가 이어 감).
on:
  workflow_dispatch:
  schedule:
    - cron: '17 */2 * * *'

concurrency:
  group: pokemon-watch
  cancel-in-progress: false

jobs:
  watch:
    runs-on: ubuntu-latest
    timeout-minutes: 355
    permissions:
      contents: write
      issues: write
      actions: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'
          cache-dependency-path: scripts/requirements.txt

      - name: Install dependencies
        run: pip install -r scripts/requirements.txt

      - name: Watch loop
        run: bash scripts/watch_loop.sh
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          GH_TOKEN: ${{ github.token }}
          THREADS_ACCOUNTS: ${{ vars.THREADS_ACCOUNTS }}
          X_BEARER_TOKEN: ${{ secrets.X_BEARER_TOKEN }}
          INSTAGRAM_ACCESS_TOKEN: ${{ secrets.INSTAGRAM_ACCESS_TOKEN }}
          INSTAGRAM_USER_ID: ${{ secrets.INSTAGRAM_USER_ID }}
          INSTAGRAM_ACCOUNTS: ${{ vars.INSTAGRAM_ACCOUNTS }}

      - name: Continue the loop
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run pokemon-watch.yml --repo "${{ github.repository }}"
