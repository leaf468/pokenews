name: Pokemon Cards Threads Bot

on:
  workflow_dispatch:
    inputs:
      mode:
        description: 'scheduled(정기 발행) 또는 breaking(속보 체크)'
        required: false
        default: 'scheduled'
        type: choice
        options:
          - scheduled
          - breaking
  schedule:
    # 정기 발행 4회 (한국시간 09/13/17/21시 = UTC 0/4/8/12시)
    - cron: '0 0,4,8,12 * * *'
    # 속보 체크: 30분마다 소스를 직접 수집한다. 수집 자체는 모델을 쓰지 않고, 속보감인 새 글이
    # 있을 때만 모델을 부른다. (공개 저장소라 Actions 사용량 제한이 없다. 비공개로 바꾸면 간격을 늘릴 것.)
    - cron: '20,50 * * * *'

# 정기 발행과 속보 체크가 겹쳐도 이력 파일을 동시에 고치지 않도록 한 번에 하나씩만 돈다.
concurrency:
  group: pokemon-cards-bot
  cancel-in-progress: false

jobs:
  post:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
      issues: write

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'
          cache-dependency-path: scripts/requirements.txt

      - name: Install dependencies
        run: pip install -r scripts/requirements.txt

      - name: Determine mode
        id: mode
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "mode=${{ inputs.mode }}" >> "$GITHUB_OUTPUT"
          elif [ "${{ github.event.schedule }}" = "0 0,4,8,12 * * *" ]; then
            echo "mode=scheduled" >> "$GITHUB_OUTPUT"
          else
            echo "mode=breaking" >> "$GITHUB_OUTPUT"
          fi

      - name: Generate Pokemon card content
        id: generate
        run: python scripts/generate_pokemon_content.py "${{ steps.mode.outputs.mode }}"
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          # 선택: 있으면 Threads 키워드 검색 / X 검색 / 인스타그램도 수집한다.
          THREADS_ACCESS_TOKEN: ${{ secrets.THREADS_ACCESS_TOKEN }}
          THREADS_USERNAME: ${{ vars.THREADS_USERNAME }}
          X_BEARER_TOKEN: ${{ secrets.X_BEARER_TOKEN }}
          INSTAGRAM_ACCESS_TOKEN: ${{ secrets.INSTAGRAM_ACCESS_TOKEN }}
          INSTAGRAM_USER_ID: ${{ secrets.INSTAGRAM_USER_ID }}
          INSTAGRAM_ACCOUNTS: ${{ vars.INSTAGRAM_ACCOUNTS }}

      - name: Post to Threads
        if: steps.generate.outputs.has_content == 'true'
        run: python scripts/post_to_threads.py "${{ steps.generate.outputs.threads_file }}" "${{ steps.generate.outputs.meta_file }}"
        env:
          THREADS_ACCESS_TOKEN: ${{ secrets.THREADS_ACCESS_TOKEN }}
          THREADS_USER_ID: ${{ secrets.THREADS_USER_ID }}

      - name: Create GitHub Issue
        if: steps.generate.outputs.has_content == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          MODE: ${{ steps.mode.outputs.mode }}
          THREADS_FILE: ${{ steps.generate.outputs.threads_file }}
          META_FILE: ${{ steps.generate.outputs.meta_file }}
        run: |
          TOPIC=$(jq -r '.topic' "$META_FILE")
          SOURCE_NAME=$(jq -r '.source_name' "$META_FILE")
          SOURCE_URL=$(jq -r '.source_url' "$META_FILE")
          IMAGE_URL=$(jq -r '.image_url // ""' "$META_FILE")
          GENERATED_AT=$(jq -r '.generated_at' "$META_FILE")

          if [ "$MODE" = "scheduled" ]; then MODE_KO="정기"; else MODE_KO="속보"; fi
          TITLE="🃏 [$MODE_KO] ${TOPIC:0:80}"

          BODY_FILE=$(mktemp)
          {
            if [ -n "$IMAGE_URL" ]; then
              echo "![관련 이미지]($IMAGE_URL)"
              echo
            fi
            echo "## 게시 본문"
            echo
            echo '```'
            cat "$THREADS_FILE"
            echo '```'
            echo
            echo "---"
            echo
            if [ -n "$SOURCE_URL" ]; then
              echo "- **출처**: [$SOURCE_NAME]($SOURCE_URL)"
            else
              echo "- **출처**: $SOURCE_NAME"
            fi
            echo "- **모드**: $MODE"
            echo "- **생성 시각(KST)**: $GENERATED_AT"
          } > "$BODY_FILE"

          gh issue create \
            --repo "${{ github.repository }}" \
            --title "$TITLE" \
            --body-file "$BODY_FILE" \
            --label "pokemon-post" \
            --label "mode:$MODE"

      # 게시가 없어도 속보 판정을 마친 글 목록이 바뀌므로 항상 실행한다.
      - name: Commit and push
        run: |
          git config user.name "Pokemon Cards Bot"
          git config user.email "pokemon-cards-bot@users.noreply.github.com"

          git add reports/pokemon_posted_state.json
          if git diff --staged --quiet; then
            echo "No changes to commit"
          else
            if [ "${{ steps.generate.outputs.has_content }}" = "true" ]; then
              git commit -m "🃏 포켓몬 카드 소식 (${{ steps.mode.outputs.mode }}) - $(TZ=Asia/Seoul date +'%Y-%m-%d %H:%M KST')"
            else
              git commit -m "chore: 속보 판정 이력 갱신"
            fi
            git fetch origin main
            git rebase origin/main
            git push origin main
          fi
