name: Pokemon Cards Threads Bot

on:
  workflow_dispatch:
    inputs:
      mode:
        description: 'scheduled(정기 발행) 또는 breaking(속보 체크)'
        required: false
        default: 'scheduled'
        type: choice
        options:
          - scheduled
          - breaking
  schedule:
    # 정기 발행 4회 (한국시간 09/13/17/21시 = UTC 0/4/8/12시)
    # Actions 무료 한도 절약을 위해 속보 체크 cron은 없앰. breaking 모드는
    # workflow_dispatch로 수동 실행 시에만 사용 (inputs.mode에서 선택 가능).
    - cron: '0 0,4,8,12 * * *'

jobs:
  post:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      issues: write

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'
          cache-dependency-path: scripts/requirements.txt

      - name: Install dependencies
        run: pip install -r scripts/requirements.txt

      - name: Determine mode
        id: mode
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "mode=${{ inputs.mode }}" >> "$GITHUB_OUTPUT"
          else
            # schedule 트리거는 이제 정기 발행 cron 하나뿐.
            echo "mode=scheduled" >> "$GITHUB_OUTPUT"
          fi

      - name: Generate Pokemon card content
        id: generate
        run: python scripts/generate_pokemon_content.py "${{ steps.mode.outputs.mode }}"
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}

      - name: Post to Threads
        if: steps.generate.outputs.has_content == 'true'
        run: python scripts/post_to_threads.py "${{ steps.generate.outputs.threads_file }}" "${{ steps.generate.outputs.meta_file }}"
        env:
          THREADS_ACCESS_TOKEN: ${{ secrets.THREADS_ACCESS_TOKEN }}
          THREADS_USER_ID: ${{ secrets.THREADS_USER_ID }}

      - name: Create GitHub Issue
        if: steps.generate.outputs.has_content == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          MODE: ${{ steps.mode.outputs.mode }}
          THREADS_FILE: ${{ steps.generate.outputs.threads_file }}
          META_FILE: ${{ steps.generate.outputs.meta_file }}
        run: |
          TOPIC=$(jq -r '.topic' "$META_FILE")
          SOURCE_NAME=$(jq -r '.source_name' "$META_FILE")
          SOURCE_URL=$(jq -r '.source_url' "$META_FILE")
          IMAGE_URL=$(jq -r '.image_url // ""' "$META_FILE")
          GENERATED_AT=$(jq -r '.generated_at' "$META_FILE")

          if [ "$MODE" = "scheduled" ]; then MODE_KO="정기"; else MODE_KO="속보"; fi
          TITLE="🃏 [$MODE_KO] ${TOPIC:0:80}"

          BODY_FILE=$(mktemp)
          {
            if [ -n "$IMAGE_URL" ]; then
              echo "![관련 이미지]($IMAGE_URL)"
              echo
            fi
            echo "## 게시 본문"
            echo
            echo '```'
            cat "$THREADS_FILE"
            echo '```'
            echo
            echo "---"
            echo
            if [ -n "$SOURCE_URL" ]; then
              echo "- **출처**: [$SOURCE_NAME]($SOURCE_URL)"
            else
              echo "- **출처**: $SOURCE_NAME"
            fi
            echo "- **모드**: $MODE"
            echo "- **생성 시각(KST)**: $GENERATED_AT"
          } > "$BODY_FILE"

          gh issue create \
            --repo "${{ github.repository }}" \
            --title "$TITLE" \
            --body-file "$BODY_FILE" \
            --label "pokemon-post" \
            --label "mode:$MODE"

      - name: Commit and push
        if: steps.generate.outputs.has_content == 'true'
        run: |
          git config user.name "Pokemon Cards Bot"
          git config user.email "pokemon-cards-bot@users.noreply.github.com"

          git add reports/pokemon_posted_state.json
          if git diff --staged --quiet; then
            echo "No changes to commit"
          else
            git commit -m "🃏 포켓몬 카드 소식 (${{ steps.mode.outputs.mode }}) - $(TZ=Asia/Seoul date +'%Y-%m-%d %H:%M KST')"
            git fetch origin main
            git rebase origin/main
            git push origin main
          fi
