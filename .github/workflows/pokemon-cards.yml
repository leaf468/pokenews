name: Pokemon Cards Threads Bot

on:
  workflow_dispatch:
    inputs:
      mode:
        description: 'scheduled(정기 발행) 또는 breaking(속보 체크)'
        required: false
        default: 'scheduled'
        type: choice
        options:
          - scheduled
          - breaking
  schedule:
    # 정기 발행 6회 (한국시간 09/12/15/18/21/23시 = UTC 0/3/6/9/12/14시)
    # 그 사이는 2시간 간격으로 속보 체크만 수행 (뉴스 없으면 조용히 스킵)
    - cron: '0 0,2,3,4,6,8,9,10,12,14,16,18,20,22 * * *'

jobs:
  post:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install -r scripts/requirements.txt

      - name: Determine mode
        id: mode
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "mode=${{ inputs.mode }}" >> "$GITHUB_OUTPUT"
          else
            UTC_HOUR=$(date -u +'%H')
            # 정기 발행 슬롯: UTC 00, 03, 06, 09, 12, 14시
            case "$UTC_HOUR" in
              00|03|06|09|12|14) echo "mode=scheduled" >> "$GITHUB_OUTPUT" ;;
              *) echo "mode=breaking" >> "$GITHUB_OUTPUT" ;;
            esac
          fi

      - name: Generate Pokemon card content
        id: generate
        run: python scripts/generate_pokemon_content.py "${{ steps.mode.outputs.mode }}"
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}

      - name: Post to Threads
        if: steps.generate.outputs.has_content == 'true'
        run: python scripts/post_to_threads.py "${{ steps.generate.outputs.threads_file }}"
        env:
          THREADS_ACCESS_TOKEN: ${{ secrets.THREADS_ACCESS_TOKEN }}
          THREADS_USER_ID: ${{ secrets.THREADS_USER_ID }}

      - name: Commit and push
        if: steps.generate.outputs.has_content == 'true'
        run: |
          git config user.name "Pokemon Cards Bot"
          git config user.email "pokemon-cards-bot@users.noreply.github.com"

          git add reports/
          if git diff --staged --quiet; then
            echo "No changes to commit"
          else
            git commit -m "🃏 포켓몬 카드 소식 (${{ steps.mode.outputs.mode }}) - $(TZ=Asia/Seoul date +'%Y-%m-%d %H:%M KST')"
            git fetch origin main
            git rebase origin/main
            git push origin main
          fi
