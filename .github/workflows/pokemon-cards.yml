name: Pokemon Cards Threads Bot

on:
  workflow_dispatch:
    inputs:
      mode:
        description: 'scheduled(정기 발행), breaking(속보 체크), buyguide(정가 구매 정보)'
        required: false
        default: 'scheduled'
        type: choice
        options:
          - scheduled
          - breaking
          - buyguide
          - stockalert
      payload:
        description: 'stockalert 전용: 브라우저 감시기가 넘기는 입고 글 JSON'
        required: false
        default: ''
        type: string
  # 정기 발행·속보·구매 정보의 자동 실행은 pokemon-watch.yml(상시 감시 루프)이 맡는다.
  # 이 워크플로는 수동 실행과 브라우저 감시기의 입고 알림(stockalert)용이다.

# 실행마다 따로 돈다 (상태 파일은 publish.sh 가 합쳐서 올리므로 서로 덮어쓰지 않는다).
concurrency:
  group: ${{ github.run_id }}
  cancel-in-progress: false

jobs:
  post:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
      issues: write

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'
          cache-dependency-path: scripts/requirements.txt

      - name: Install dependencies
        run: pip install -r scripts/requirements.txt

      - name: Determine mode
        id: mode
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "mode=${{ inputs.mode }}" >> "$GITHUB_OUTPUT"
          else
            echo "mode=breaking" >> "$GITHUB_OUTPUT"
          fi

      - name: Generate Pokemon card content
        id: generate
        run: python scripts/generate_pokemon_content.py "${{ steps.mode.outputs.mode }}"
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          STOCK_ALERT_PAYLOAD: ${{ inputs.payload }}
          # 선택: 지켜볼 Threads 계정 목록(변수), X 검색·인스타그램 토큰이 있으면 그것도 수집한다.
          THREADS_ACCOUNTS: ${{ vars.THREADS_ACCOUNTS }}
          X_BEARER_TOKEN: ${{ secrets.X_BEARER_TOKEN }}
          INSTAGRAM_ACCESS_TOKEN: ${{ secrets.INSTAGRAM_ACCESS_TOKEN }}
          INSTAGRAM_USER_ID: ${{ secrets.INSTAGRAM_USER_ID }}
          INSTAGRAM_ACCOUNTS: ${{ vars.INSTAGRAM_ACCOUNTS }}

      # Issue 생성과 상태 커밋 (감시 루프와 동시에 돌아도 서로의 기록을 합쳐서 올린다)
      - name: Publish
        env:
          GH_TOKEN: ${{ github.token }}
        run: >
          bash scripts/publish.sh "${{ steps.mode.outputs.mode }}" "${{ steps.generate.outputs.has_content }}"
          "${{ steps.generate.outputs.threads_file }}" "${{ steps.generate.outputs.meta_file }}"
